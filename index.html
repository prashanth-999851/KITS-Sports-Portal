<html lang="en">

    <link rel="icon" type="image/png" href="/logo.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KiTS Sports Club Portal | Official Sports Directorate</title>
    <meta name="description" content="Official Sports Management Portal of KKR & KSR Institute of Technology & Sciences. Register for sports, track memberships, view live scores, JNTUK represented athletes, and university honors." />
    <meta name="keywords" content="KiTS Sports Club, KITS Sports, JNTUK Sports, Inter-University Athletes, Guntur Sports, College Sports Portal, Live Scores, Varsity Athletics" />
    <meta name="author" content="KKR & KSR Institute Physical Education Directorate" />
    <meta name="theme-color" content="#0b2e5b" />
    <link rel="canonical" href="https://kkrksr.ac.in/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kkrksr.ac.in/" />
    <meta property="og:title" content="KiTS Sports Club Portal | Official Sports Directorate" />
    <meta property="og:description" content="Official Sports Management Portal of KKR & KSR Institute of Technology & Sciences. Register for sports, track memberships, view live scores, and JNTUK varsity athletes." />

    <meta name="twitter:card" content="summary_large_image" />

  </head>
  <body class="antialiased font-sans" style="margin:0; background-color: #0b1e38;">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0b1e38; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; text-align: center; padding: 20px;">
        <div style="position: relative; width: 80px; height: 80px; margin-bottom: 24px; display: flex; align-items: center; justify-content: center;">
          <div style="position: absolute; inset: -8px; border-radius: 50%; border: 3px solid rgba(59, 130, 246, 0.2); border-top-color: #3b82f6; animation: kits-spin 1s linear infinite;"></div>
          <img src="/logo.png" alt="KiTS Sports" style="width: 54px; height: 54px; object-fit: contain; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4));" />
        </div>
        <h1 style="font-size: 18px; font-weight: 700; margin: 0 0 6px 0; letter-spacing: -0.02em; color: #ffffff;">KiTS Sports Directorate</h1>
        <p style="font-size: 12px; color: #94a3b8; margin: 0; font-weight: 500;">Loading Sports Management Portal...</p>
      </div>
      <style>
        @keyframes kits-spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
